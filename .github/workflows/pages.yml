# Checks, tests and publishes the web app to GitHub Pages (design.md decision 9).
# Any failing step stops the run before deploying, so the old site stays up.

name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # a "Run workflow" button in the Actions tab

# What this workflow's token may do: read the code, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (with the WebAssembly target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Node (with an npm cache)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rust checks
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build the WASM package
        working-directory: web
        run: npm run wasm

      - name: Web checks and build
        working-directory: web
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
