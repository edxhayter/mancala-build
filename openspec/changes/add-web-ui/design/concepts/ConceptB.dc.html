<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept B · Carved print</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Archivo:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8e2a2e}a:hover{color:#1f120c}
</style>
</helmet>
<div style="width: 1280px; height: 820px; box-sizing: border-box; padding: 36px 56px 40px; display: flex; flex-direction: column; gap: 18px; background: #f1e5d1; color: #1f120c; font-family: 'Archivo', sans-serif;">

  <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <h1 style="margin: 0; font-family: 'Alfa Slab One', serif; font-weight: 400; font-size: 60px; letter-spacing: 0.02em; line-height: 0.9;">MANCALA</h1>
      <div style="display: flex; gap: 6px; align-items: center;">
        <span style="display: block; width: 64px; height: 8px; background: #8e2a2e;"></span>
        <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;">Kalah · 6 pits · 4 seeds</span>
      </div>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 22px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;">Opponent</span>
        <div style="display: flex; gap: 0;">
          <button style="all: unset; cursor: pointer; padding: 9px 14px; border: 2.5px solid #1f120c; background: #8e2a2e; color: #f6ecdc; font-weight: 800; font-size: 15px;">AI</button>
          <button style="all: unset; cursor: pointer; padding: 9px 14px; border: 2.5px solid #1f120c; border-left: none; font-weight: 600; font-size: 15px;">Random</button>
          <button style="all: unset; cursor: pointer; padding: 9px 14px; border: 2.5px solid #1f120c; border-left: none; font-weight: 600; font-size: 15px;">Hotseat</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;">Level</span>
        <div style="display: flex; gap: 0;">
          <button style="all: unset; cursor: pointer; padding: 9px 14px; border: 2.5px solid #1f120c; font-weight: 600; font-size: 15px;">Easy</button>
          <button style="all: unset; cursor: pointer; padding: 9px 14px; border: 2.5px solid #1f120c; border-left: none; background: #8e2a2e; color: #f6ecdc; font-weight: 800; font-size: 15px;">Medium</button>
          <button style="all: unset; cursor: pointer; padding: 9px 14px; border: 2.5px solid #1f120c; border-left: none; font-weight: 600; font-size: 15px;">Hard</button>
        </div>
      </div>
      <button style="all: unset; cursor: pointer; padding: 11px 22px; border: 2.5px solid #1f120c; background: #d1894a; font-family: 'Alfa Slab One', serif; font-size: 18px; letter-spacing: 0.03em; box-shadow: 5px 5px 0 #1f120c;">NEW GAME</button>
    </div>
  </div>

  <svg aria-hidden="true" width="1168" height="22" viewBox="0 0 1168 22" style="display: block;">
    <defs>
      <pattern id="cuts" width="56" height="22" patternUnits="userSpaceOnUse">
        <line x1="2" y1="0" x2="2" y2="22" stroke="#1f120c" stroke-width="2.5"></line>
        <line x1="8" y1="0" x2="8" y2="22" stroke="#1f120c" stroke-width="1.2"></line>
        <path d="M18 3 L30 11 L18 19 Z" fill="#1f120c"></path>
        <path d="M46 3 L34 11 L46 19 Z" fill="#8e2a2e"></path>
      </pattern>
    </defs>
    <rect width="1168" height="22" fill="url(#cuts)"></rect>
  </svg>

  <div style="display: flex; justify-content: center; padding-top: 22px;">
    <dc-import name="Board" variant="flat" wood="#d1894a" wood-edge="#9a5426" cup-mid="#a8622f" cup-deep="#6e3412" seed="#a9a69a" seed-alt="#9c998d" ink="#1f120c" numeral="#1f120c" numeral-font="'Alfa Slab One', serif" hint-size="1000px,360px"></dc-import>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 48px; padding-top: 22px;">
    <div style="display: flex; gap: 22px; align-items: stretch;">
      <div style="display: flex; align-items: center; padding: 0 22px; background: #8e2a2e; color: #f6ecdc; font-family: 'Alfa Slab One', serif; font-size: 24px; letter-spacing: 0.03em; border: 2.5px solid #1f120c;">YOUR MOVE · SOUTH</div>
      <div style="display: flex; flex-direction: column; gap: 4px; font-size: 16px;">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;">North's turn</span>
        <span>Pit 3 (4 seeds) — extra turn</span>
        <span>Pit 5 (5 seeds)</span>
        <span style="font-weight: 600;">Store 0 → 2</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-end;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;">Sowing</span>
        <div style="display: flex;">
          <button style="all: unset; cursor: pointer; padding: 6px 12px; border: 2.5px solid #1f120c; font-weight: 600; font-size: 14px;">Slow</button>
          <button style="all: unset; cursor: pointer; padding: 6px 12px; border: 2.5px solid #1f120c; border-left: none; background: #1f120c; color: #f1e5d1; font-weight: 800; font-size: 14px;">Normal</button>
          <button style="all: unset; cursor: pointer; padding: 6px 12px; border: 2.5px solid #1f120c; border-left: none; font-weight: 600; font-size: 14px;">Instant</button>
        </div>
      </div>
      <span style="font-size: 14px; font-weight: 600;">Seed 5 · you play South</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
