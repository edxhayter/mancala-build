<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop · new game</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; color: #2b1810; font-family: 'Atkinson Hyperlegible', sans-serif;">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0;">
    <dc-import name="Main" hint-size="1280px,800px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1280px; height: 800px; background: rgba(43,24,16,0.42);"></div>

  <div role="dialog" aria-label="New game" style="position: absolute; left: 380px; top: 80px; width: 520px; box-sizing: border-box; padding: 30px 36px 28px; background: #f4eadb; border-radius: 6px; box-shadow: 0 18px 40px rgba(43,24,16,0.35); display: flex; flex-direction: column; gap: 22px;">
    <h2 style="margin: 0; font-family: 'Marcellus SC', serif; font-weight: 400; font-size: 32px; letter-spacing: 0.04em;">New game</h2>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <button aria-pressed="true" style="all: unset; cursor: pointer; padding: 14px 16px; border-radius: 6px; border: 2px solid #2b1810; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-family: 'Marcellus SC', serif; font-size: 20px;">Computer</span>
        <span style="font-size: 14px; color: #6b4a35;">Play the AI</span>
      </button>
      <button aria-pressed="false" style="all: unset; cursor: pointer; padding: 14px 16px; border-radius: 6px; border: 2px solid #d8c6b0; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-family: 'Marcellus SC', serif; font-size: 20px;">Two players</span>
        <span style="font-size: 14px; color: #6b4a35;">Take turns on this device</span>
      </button>
      <button disabled aria-disabled="true" style="all: unset; padding: 14px 16px; border-radius: 6px; border: 2px dashed #d8c6b0; display: flex; flex-direction: column; gap: 4px; color: #6b4a35;">
        <span style="font-family: 'Marcellus SC', serif; font-size: 20px;">Online</span>
        <span style="font-size: 14px;">Play a friend · coming later</span>
      </button>
      <button disabled aria-disabled="true" style="all: unset; padding: 14px 16px; border-radius: 6px; border: 2px dashed #d8c6b0; display: flex; flex-direction: column; gap: 4px; color: #6b4a35;">
        <span style="font-family: 'Marcellus SC', serif; font-size: 20px;">Puzzles</span>
        <span style="font-size: 14px;">Find the best move · coming later</span>
      </button>
    </div>

    <div style="display: flex; gap: 40px;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b4a35;">Computer level</span>
        <div style="display: flex; gap: 18px; font-size: 17px;">
          <button aria-pressed="false" style="all: unset; cursor: pointer; padding: 6px 0; border-bottom: 2px solid transparent; color: #6b4a35;">Easy</button>
          <button aria-pressed="true" style="all: unset; cursor: pointer; padding: 6px 0; border-bottom: 2px solid #2b1810; font-weight: 700;">Medium</button>
          <button aria-pressed="false" style="all: unset; cursor: pointer; padding: 6px 0; border-bottom: 2px solid transparent; color: #6b4a35;">Hard</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b4a35;">You play</span>
        <div style="display: flex; gap: 18px; font-size: 17px;">
          <button aria-pressed="true" style="all: unset; cursor: pointer; padding: 6px 0; border-bottom: 2px solid #2b1810; font-weight: 700;">First</button>
          <button aria-pressed="false" style="all: unset; cursor: pointer; padding: 6px 0; border-bottom: 2px solid transparent; color: #6b4a35;">Second</button>
        </div>
      </div>
    </div>

    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 22px; padding-top: 4px;">
      <button style="all: unset; cursor: pointer; padding: 10px 4px; font-size: 17px; color: #6b4a35;">Cancel</button>
      <button style="all: unset; cursor: pointer; padding: 12px 24px; border-radius: 22px; background: #c8844c; color: #2b1810; font-family: 'Marcellus SC', serif; font-size: 18px; letter-spacing: 0.04em; box-shadow: inset 0 1px 0 rgba(255,226,190,0.5), inset 0 -2px 0 rgba(83,32,4,0.35), 0 3px 6px rgba(43,24,16,0.25);">Start game</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
