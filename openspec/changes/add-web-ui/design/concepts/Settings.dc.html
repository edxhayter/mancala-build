<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop · settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; color: #2b1810; font-family: 'Atkinson Hyperlegible', sans-serif;">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0;">
    <dc-import name="Main" hint-size="1280px,800px"></dc-import>
  </div>

  <div role="dialog" aria-label="Settings" style="position: absolute; right: 44px; top: 94px; width: 300px; box-sizing: border-box; padding: 20px 22px 22px; background: #f4eadb; border-radius: 6px; box-shadow: 0 12px 28px rgba(43,24,16,0.28); display: flex; flex-direction: column; gap: 10px;">
    <div aria-hidden="true" style="position: absolute; right: 26px; top: -7px; width: 14px; height: 14px; background: #f4eadb; transform: rotate(45deg);"></div>
    <span style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b4a35;">Sowing speed</span>
    <div style="display: flex; gap: 20px; font-size: 17px;">
      <button aria-pressed="false" style="all: unset; cursor: pointer; padding: 6px 0; border-bottom: 2px solid transparent; color: #6b4a35;">Slow</button>
      <button aria-pressed="true" style="all: unset; cursor: pointer; padding: 6px 0; border-bottom: 2px solid #2b1810; font-weight: 700;">Normal</button>
      <button aria-pressed="false" style="all: unset; cursor: pointer; padding: 6px 0; border-bottom: 2px solid transparent; color: #6b4a35;">Instant</button>
    </div>
    <span style="font-size: 14px; color: #6b4a35;">Instant skips the seed-by-seed animation.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
